<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Website</title>

  <style>
    :root {
      --footer-bg: #2c3e50;
      --footer-text: #ecf0f1;
      --footer-link: #1abc9c;
      --footer-link-hover: #16a085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    .site-footer {
      background: var(--footer-bg);
      color: var(--footer-text);
      padding: 2rem 1rem;
    }

    .footer-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-nav,
    .footer-contact,
    .footer-social {
      flex: 1 1 200px;
      margin: 0.5rem;
    }

    .footer-title {
      font-size: 1.2rem;
      margin: 0 0 0.5rem;
    }

    .footer-nav ul,
    .social-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-nav li {
      margin-bottom: 0.35rem;
    }

    .footer-nav a,
    .footer-contact a,
    .social-list a {
      color: var(--footer-link);
      text-decoration: none;
    }

    .footer-nav a:hover,
    .footer-contact a:hover,
    .social-list a:hover {
      color: var(--footer-link-hover);
    }

    .footer-contact address {
      font-style: normal;
      line-height: 1.7;
    }

    .social-list {
      display: flex;
      gap: 0.5rem;
    }

    .social-list a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      background: var(--footer-link);
      border-radius: 50%;
      color: var(--footer-bg);
      font-weight: bold;
    }

    .social-list a:hover {
      background: var(--footer-link-hover);
      color: var(--footer-bg);
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 1rem auto 0;
      padding-top: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .footer-bottom p {
      margin: 0;
    }

    @media (max-width: 600px) {
      .footer-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .footer-nav,
      .footer-contact,
      .footer-social {
        width: 100%;
        margin: 1rem 0;
      }

      .social-list {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <!-- Main content of the site would go here -->

  <footer class="site-footer">
    <div class="footer-container">

      <nav class="footer-nav" aria-label="Quick Links">
        <h2 class="footer-title">Quick Links</h2>
        <ul>
          <li><a href="#">Admissions</a></li>
          <li><a href="#">Academics</a></li>
          <li><a href="#">Research</a></li>
          <li><a href="#">Alumni</a></li>
        </ul>
      </nav>

      <section class="footer-contact">
        <h2 class="footer-title">Contact Us</h2>
        <address>
          123 University Ave<br>
          City, State ZIP<br>
          <a href="tel:+1234567890">+1 (234) 567-890</a><br>
          <a href="mailto:info@university.edu">info@university.edu</a>
        </address>
      </section>

      <section class="footer-social">
        <h2 class="footer-title">Follow Us</h2>
        <ul class="social-list">
          <li>
            <a href="#" aria-label="Facebook">F</a>
          </li>
          <li>
            <a href="#" aria-label="Twitter">T</a>
          </li>
          <li>
            <a href="#" aria-label="Instagram">I</a>
          </li>
          <li>
            <a href="#" aria-label="LinkedIn">L</a>
          </li>
        </ul>
      </section>

    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 University Name. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
